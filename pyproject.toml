[project]
name = "calleval"
version = "0.1.0"
description = "Post-call customer experience evaluation for contact-centre transcripts (lending/servicing calls)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["calleval", "calleval.extract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
